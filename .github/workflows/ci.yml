name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate production dependency security patch
        run: |
          npm audit fix --package-lock-only --omit=dev
          git diff -- package-lock.json
          exit 1
      - run: npm run check
      - run: docker build -t quatsch-pro:${{ github.sha }} .
