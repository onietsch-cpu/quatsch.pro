name: Production smoke

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.actor == 'railway-app[bot]')
    name: verify production
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test public production
        shell: bash
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          header_value() {
            local name="$1"
            local file="$2"
            awk -v name="$name" 'BEGIN { IGNORECASE=1 } $0 ~ "^" name ":" { sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); value=$0 } END { print value }' "$file"
          }

          assert_status() {
            local actual="$1"
            local expected="$2"
            local label="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "FAIL $label: expected HTTP $expected, got $actual" >&2
              exit 1
            fi
            echo "PASS $label: HTTP $actual"
          }

          get_request() {
            local url="$1"
            local body="$2"
            local headers="$3"
            curl --silent --show-error --compressed --location \
              --connect-timeout 10 --max-time 45 \
              --retry 2 --retry-all-errors --retry-delay 2 \
              --user-agent "quatsch.pro-production-smoke/1.0" \
              --header "Accept: text/html" \
              --dump-header "$headers" --output "$body" \
              --write-out "%{http_code}" "$url"
          }

          for domain in quatsch.pro www.quatsch.pro; do
            status="$(get_request "https://$domain/" "$workdir/root-body" "$workdir/root-headers")"
            assert_status "$status" "200" "https://$domain/"
            content_type="$(header_value content-type "$workdir/root-headers")"
            [[ "$content_type" == text/html* ]] || { echo "FAIL https://$domain/: unexpected Content-Type $content_type" >&2; exit 1; }
            root_bytes="$(wc -c < "$workdir/root-body")"
            (( root_bytes > 500 )) || { echo "FAIL https://$domain/: HTML response is unexpectedly small ($root_bytes bytes)" >&2; exit 1; }
          done

          status="$(get_request "https://www.quatsch.pro/healthz" "$workdir/health-body" "$workdir/health-headers")"
          assert_status "$status" "200" "/healthz"
          # Railway uses /healthz for liveness. The public API health route below validates the JSON contract.

          status="$(get_request "https://www.quatsch.pro/hcgi/api/health" "$workdir/api-health-body" "$workdir/api-health-headers")"
          assert_status "$status" "200" "/hcgi/api/health"
          jq -e '.status == "ok" and .aiProviderConfigured == true' "$workdir/api-health-body" >/dev/null
          rate_limit_policy="$(header_value ratelimit-policy "$workdir/api-health-headers")"
          [[ "$rate_limit_policy" == "10000;w=3600" ]] || {
            echo "FAIL /hcgi/api/health: unexpected RateLimit-Policy $rate_limit_policy" >&2
            exit 1
          }
          echo "PASS API rate limit policy: $rate_limit_policy"

          for path in /.env /.git/config /wp-admin/install.php; do
            status="$(get_request "https://www.quatsch.pro$path" "$workdir/not-found-body" "$workdir/not-found-headers")"
            assert_status "$status" "404" "$path"
            content_type="$(header_value content-type "$workdir/not-found-headers")"
            [[ "$content_type" == application/json* ]] || { echo "FAIL $path: unexpected Content-Type $content_type" >&2; exit 1; }
            jq -e '.error == "Not found" and (keys == ["error"])' "$workdir/not-found-body" >/dev/null
          done

          translation_source="Good morning, how are you today?"
          conversation_languages=(
            "de-DE|German|Guten Morgen, wie geht es Ihnen heute?"
            "en-US|English|Good morning, how are you today?"
            "vi-VN|Vietnamese|Ch\\u00e0o bu\\u1ed5i s\\u00e1ng, h\\u00f4m nay b\\u1ea1n kh\\u1ecfe kh\\u00f4ng?"
            "fr-FR|French|Bonjour, comment allez-vous aujourd'hui?"
            "es-ES|Spanish|Buenos d\\u00edas, \\u00bfc\\u00f3mo est\\u00e1s hoy?"
            "it-IT|Italian|Buongiorno, come stai oggi?"
            "pt-PT|Portuguese|Bom dia, como voc\\u00ea est\\u00e1 hoje?"
            "nl-NL|Dutch|Goedemorgen, hoe gaat het vandaag met u?"
            "pl-PL|Polish|Dzie\\u0144 dobry, jak si\\u0119 dzisiaj masz?"
            "tr-TR|Turkish|G\\u00fcnayd\\u0131n, bug\\u00fcn nas\\u0131ls\\u0131n\\u0131z?"
            "ar-SA|Arabic|\\u0635\\u0628\\u0627\\u062d \\u0627\\u0644\\u062e\\u064a\\u0631\\u060c \\u0643\\u064a\\u0641 \\u062d\\u0627\\u0644\\u0643 \\u0627\\u0644\\u064a\\u0648\\u0645\\u061f"
            "ru-RU|Russian|\\u0414\\u043e\\u0431\\u0440\\u043e\\u0435 \\u0443\\u0442\\u0440\\u043e, \\u043a\\u0430\\u043a \\u0432\\u044b \\u0441\\u0435\\u0431\\u044f \\u0447\\u0443\\u0432\\u0441\\u0442\\u0432\\u0443\\u0435\\u0442\\u0435 \\u0441\\u0435\\u0433\\u043e\\u0434\\u043d\\u044f?"
            "uk-UA|Ukrainian|\\u0414\\u043e\\u0431\\u0440\\u043e\\u0433\\u043e \\u0440\\u0430\\u043d\\u043a\\u0443, \\u044f\\u043a \\u0432\\u0438 \\u0441\\u044c\\u043e\\u0433\\u043e\\u0434\\u043d\\u0456?"
            "zh-CN|Chinese|\\u65e9\\u4e0a\\u597d\\uff0c\\u4f60\\u4eca\\u5929\\u597d\\u5417\\uff1f"
            "ja-JP|Japanese|\\u304a\\u306f\\u3088\\u3046\\u3054\\u3056\\u3044\\u307e\\u3059\\u3002\\u4eca\\u65e5\\u306f\\u304a\\u5143\\u6c17\\u3067\\u3059\\u304b\\uff1f"
            "ko-KR|Korean|\\uc88b\\uc740 \\uc544\\uce68\\uc785\\ub2c8\\ub2e4. \\uc624\\ub298 \\uc5b4\\ub5bb\\uac8c \\uc9c0\\ub0b4\\uc138\\uc694?"
            "th-TH|Thai|\\u0e2a\\u0e27\\u0e31\\u0e2a\\u0e14\\u0e35\\u0e15\\u0e2d\\u0e19\\u0e40\\u0e0a\\u0e49\\u0e32 \\u0e27\\u0e31\\u0e19\\u0e19\\u0e35\\u0e49\\u0e04\\u0e38\\u0e13\\u0e40\\u0e1b\\u0e47\\u0e19\\u0e2d\\u0e22\\u0e48\\u0e32\\u0e07\\u0e44\\u0e23\\u0e1a\\u0e49\\u0e32\\u0e07"
            "id-ID|Indonesian|Selamat pagi, apa kabar hari ini?"
            "hi-IN|Hindi|\\u0938\\u0941\\u092a\\u094d\\u0930\\u092d\\u093e\\u0924, \\u0906\\u091c \\u0906\\u092a \\u0915\\u0948\\u0938\\u0947 \\u0939\\u0948\\u0902?"
          )

          for language in "${conversation_languages[@]}"; do
            IFS='|' read -r target_code target_name source_escaped <<< "$language"
            printf -v source_text '%b' "$source_escaped"
            target_base="${target_code%%-*}"
            target_base="${target_base,,}"
            payload="$(jq -nc \
              --arg text "$translation_source" \
              --arg sourceCode "en-US" \
              --arg targetName "$target_name" \
              --arg targetCode "$target_code" \
              '{text: $text, sourceLanguageCode: $sourceCode, targetLanguageName: $targetName, targetLanguageCode: $targetCode}')"

            translate_status="$(curl --silent --show-error --compressed \
              --connect-timeout 10 --max-time 60 \
              --user-agent "quatsch.pro-production-smoke/1.0" \
              --header "Content-Type: application/json" \
              --header "X-Requested-With: XMLHttpRequest" \
              --header "Origin: https://www.quatsch.pro" \
              --data-binary "$payload" \
              --dump-header "$workdir/translate-$target_code-headers" \
              --output "$workdir/translate-$target_code-body" \
              --write-out "%{http_code}" \
              "https://www.quatsch.pro/hcgi/api/translate")"
            assert_status "$translate_status" "200" "/hcgi/api/translate ($target_name)"
            jq -e --arg target "$target_base" '
              (.translation | type == "string" and length > 0) and
              (.detectedLanguageCode | ascii_downcase | startswith("en")) and
              ((.translatedLanguageCode | ascii_downcase | split("-")[0]) == $target)
            ' "$workdir/translate-$target_code-body" >/dev/null
            translate_request_id="$(header_value x-request-id "$workdir/translate-$target_code-headers")"
            echo "PASS English to $target_name translation${translate_request_id:+, request $translate_request_id}"

            if [[ "$target_base" != "en" ]]; then
              reverse_payload="$(jq -nc \
                --arg text "$source_text" \
                --arg sourceCode "$target_code" \
                --arg targetName "English" \
                --arg targetCode "en-US" \
                '{text: $text, sourceLanguageCode: $sourceCode, targetLanguageName: $targetName, targetLanguageCode: $targetCode}')"

              reverse_status="$(curl --silent --show-error --compressed \
                --connect-timeout 10 --max-time 60 \
                --user-agent "quatsch.pro-production-smoke/1.0" \
                --header "Content-Type: application/json" \
                --header "X-Requested-With: XMLHttpRequest" \
                --header "Origin: https://www.quatsch.pro" \
                --data-binary "$reverse_payload" \
                --dump-header "$workdir/reverse-$target_code-headers" \
                --output "$workdir/reverse-$target_code-body" \
                --write-out "%{http_code}" \
                "https://www.quatsch.pro/hcgi/api/translate")"
              assert_status "$reverse_status" "200" "/hcgi/api/translate ($target_name to English)"
              jq -e --arg source "$target_base" '
                (.translation | type == "string" and length > 0) and
                ((.detectedLanguageCode | ascii_downcase | split("-")[0]) == $source) and
                ((.translatedLanguageCode | ascii_downcase | split("-")[0]) == "en")
              ' "$workdir/reverse-$target_code-body" >/dev/null
              reverse_request_id="$(header_value x-request-id "$workdir/reverse-$target_code-headers")"
              echo "PASS $target_name to English translation${reverse_request_id:+, request $reverse_request_id}"
            fi
          done

          for language in "${conversation_languages[@]}"; do
            IFS='|' read -r tts_code tts_name tts_text_escaped <<< "$language"
            printf -v tts_text '%b' "$tts_text_escaped"
            tts_payload="$(jq -nc \
              --arg text "$tts_text" \
              --arg langCode "$tts_code" \
              '{text: $text, langCode: $langCode}')"

            tts_status="$(curl --silent --show-error --compressed \
              --connect-timeout 10 --max-time 60 \
              --user-agent "quatsch.pro-production-smoke/1.0" \
              --header "Content-Type: application/json" \
              --header "X-Requested-With: XMLHttpRequest" \
              --header "Origin: https://www.quatsch.pro" \
              --data-binary "$tts_payload" \
              --dump-header "$workdir/tts-$tts_code-headers" \
              --output "$workdir/tts-$tts_code-audio" \
              --write-out "%{http_code}" \
              "https://www.quatsch.pro/hcgi/api/tts")"
            assert_status "$tts_status" "200" "/hcgi/api/tts ($tts_name)"
            tts_content_type="$(header_value content-type "$workdir/tts-$tts_code-headers")"
            [[ "$tts_content_type" == audio/mpeg* ]] || { echo "FAIL $tts_name TTS: unexpected Content-Type $tts_content_type" >&2; exit 1; }
            cache_control="$(header_value cache-control "$workdir/tts-$tts_code-headers")"
            [[ "$cache_control" == *private* && "$cache_control" == *no-store* ]] || { echo "FAIL $tts_name TTS: unexpected Cache-Control $cache_control" >&2; exit 1; }
            audio_bytes="$(wc -c < "$workdir/tts-$tts_code-audio")"
            (( audio_bytes > 100 )) || { echo "FAIL $tts_name TTS: audio response is empty" >&2; exit 1; }
            tts_request_id="$(header_value x-request-id "$workdir/tts-$tts_code-headers")"
            echo "PASS $tts_name TTS: $audio_bytes bytes${tts_request_id:+, request $tts_request_id}"
          done

          {
            echo '### Production smoke test'
            echo
            echo 'All public production checks passed: domains, health, hardened 404 routes, the complete bidirectional 19-language Conversation Mode translation and TTS matrices.'
          } >> "$GITHUB_STEP_SUMMARY"
