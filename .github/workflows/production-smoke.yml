name: Production smoke

on:
  push:
    branches: [main, codex/playwright-production-smoke]
    paths:
      - .github/workflows/production-smoke.yml
      - .github/scripts/production-smoke.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: verify production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/quatsch-production-smoke"
          mkdir -p "$smoke_dir"
          cp .github/scripts/production-smoke.mjs "$smoke_dir/"
          cd "$smoke_dir"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-exact playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test public production
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/quatsch-production-smoke"
          node production-smoke.mjs
      - name: Summarize
        if: success()
        run: |
          {
            echo '### Production smoke test'
            echo
            echo 'All public production checks passed: domains, health, hardened 404 routes, translation, and TTS.'
          } >> "$GITHUB_STEP_SUMMARY"
