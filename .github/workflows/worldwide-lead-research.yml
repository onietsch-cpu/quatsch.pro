name: Worldwide SME App Lead Research

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/worldwide-lead-research.yml'
      - 'geofabrik_lead_research.py.gz.b64'
      - 'geofabrik_v2.patch'
  workflow_dispatch:

concurrency:
  group: worldwide-sme-app-lead-research
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          python -m pip install --upgrade requests dnspython

      - name: Restore and apply quality patch
        run: |
          base64 --decode geofabrik_lead_research.py.gz.b64 | gzip --decompress > geofabrik_lead_research.py
          patch --forward geofabrik_lead_research.py < geofabrik_v2.patch

      - name: Validate script
        run: python -m py_compile geofabrik_lead_research.py

      - name: Collect and validate 10,000 public business contacts
        run: python geofabrik_lead_research.py --target 10000 --output output

      - name: Package result
        if: always()
        run: |
          mkdir -p artifact
          cp -r output/. artifact/ 2>/dev/null || true
          cp geofabrik_lead_research.py artifact/
          printf '%s\n' "Public business contacts only. Recheck every source before outreach." > artifact/LEGAL_AND_QUALITY_NOTICE.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldwide-sme-app-leads-10000-v2
          path: artifact
          if-no-files-found: error
          retention-days: 7
