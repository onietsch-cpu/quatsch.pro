name: Overpass Source Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/overpass-smoke.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe public sources
        shell: python
        run: |
          import json
          import urllib.parse
          import urllib.request

          query='[out:json][timeout:60];nwr["contact:email"](51.45,-0.30,51.65,0.10);out tags center 20;'
          data=urllib.parse.urlencode({'data': query}).encode()
          req=urllib.request.Request('https://overpass-api.de/api/interpreter', data=data, headers={'User-Agent':'CustomerExpertsLeadResearch/1.0'})
          with urllib.request.urlopen(req, timeout=120) as response:
              payload=json.load(response)
          print('OVERPASS_ELEMENTS', len(payload.get('elements', [])))

          req=urllib.request.Request('https://directory.wispra.com/api/companies.json', headers={'User-Agent':'CustomerExpertsLeadResearch/1.0'})
          with urllib.request.urlopen(req, timeout=120) as response:
              payload=json.load(response)
          print('WISPRA_ROWS', len(payload.get('data', [])))
